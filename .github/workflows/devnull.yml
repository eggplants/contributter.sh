name: Post contributter to /dev/null

on:
  schedule:
    # 00:00 JST
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      monthly:
        description: Also post the contributions of last month
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - name: Count contributions
        id: contributter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'body<<EOF'
            ./contributter eggplants
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: nunomaduro/dev-null.sh/.github/actions/commit@3e251670834fc0c034f96e1c2c308655574b9ce7 # production
        with:
          body: ${{ steps.contributter.outputs.body }}
          ssh-key: ${{ secrets.DEVNULL_SSH_KEY }}
      - name: Count contributions of last month
        id: monthly
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_MONTHLY: ${{ inputs.monthly }}
        run: |
          # only on the first day of the month (JST), unless forced
          [[ "$(date +%d)" == 01 || "$FORCE_MONTHLY" == true ]] || exit 0
          body="$(./contributter -m eggplants)"
          # "eggplants さんの 2026/09 の contribution 数: 123" -> "2026-09,123"
          record="$(head -1 <<<"$body" \
            | sed -nE 's|^.* さんの ([0-9]{4})/([0-9]{2}) の contribution 数: ([0-9]+)$|\1-\2,\3|p')"
          {
            echo 'body<<EOF'
            echo "$body"
            echo 'EOF'
            echo "record=${record}"
          } >> "$GITHUB_OUTPUT"
      - uses: nunomaduro/dev-null.sh/.github/actions/commit@3e251670834fc0c034f96e1c2c308655574b9ce7 # production
        if: steps.monthly.outputs.body != ''
        with:
          body: ${{ steps.monthly.outputs.body }}
          ssh-key: ${{ secrets.DEVNULL_SSH_KEY }}
      - name: Append to history.csv
        if: steps.monthly.outputs.record != ''
        env:
          RECORD: ${{ steps.monthly.outputs.record }}
        run: |
          # skip if the month is already recorded (e.g. re-run)
          grep -q "^${RECORD%%,*}," history.csv 2>/dev/null && exit 0
          echo "$RECORD" >> history.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history.csv
          git commit -m "chore: add ${RECORD%%,*} to history.csv"
          git push
